[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "https://www.booknix.net/*"
  to = "https://booknix.net/:splat"
  status = 301
  force = true

[[headers]]
  for = "/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
